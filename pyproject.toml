[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "streamlit-markdown-editor"
version = "0.0.2"
description = "A dual-mode (WYSIWYG/raw) markdown editor component for Streamlit."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Jeff Lowrey" }]
keywords = ["streamlit", "markdown", "editor", "wysiwyg", "component"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "streamlit>=1.60",
]

[project.optional-dependencies]
dev = [
  "flake8-cognitive-complexity>=0.1.0",
  "flake8>=7.3.0",
  "flake8-pyproject>=1.2.3",
]

[project.urls]
Homepage = "https://github.com/jaral-labs/streamlit-markdown-editor"
Repository = "https://github.com/jaral-labs/streamlit-markdown-editor"
Issues = "https://github.com/jaral-labs/streamlit-markdown-editor/issues"

# PEP 735 dev dependency group (installed via `uv sync`).
[dependency-groups]
dev = [
  "ruff",
  "mypy",
  "pytest",
  "pytest-cov",
  "pre-commit",
  "bandit[toml]",
]

# src-layout: ship the package from src/ (TECH-001).
[tool.hatch.build.targets.wheel]
packages = ["src/streamlit_markdown_editor"]

# The frontend bundle is a build artifact: generated by `npm run build`, ignored
# by git, and never committed. force-include is required because hatchling's
# default file selection honours .gitignore — without it the wheel builds and
# publishes successfully with no frontend at all. Build the frontend *before*
# `uv build`; CI does this and then asserts the assets landed (see publish.yml).
[tool.hatch.build.targets.wheel.force-include]
"frontend/build" = "streamlit_markdown_editor/frontend"
# Streamlit discovers the component manifest by scanning installed distributions
# for a pyproject.toml declaring [[tool.streamlit.component.components]] — the
# repo-root copy is never installed, so ship this file inside the package. It
# carries [project].name, which the scanner requires to validate that the
# manifest belongs to this distribution (it rejects manifests it cannot attribute).
"pyproject.toml" = "streamlit_markdown_editor/pyproject.toml"

# Ship the same assets in the sdist so it can be rebuilt without Node.
[tool.hatch.build.targets.sdist.force-include]
"frontend/build" = "frontend/build"

# The force-include above targets `frontend/build`, a gitignored artifact that is
# absent on a dev/editable install (`uv sync`) or a fresh checkout — hatchling
# then raises FileNotFoundError before any file is collected. This build hook
# creates the (possibly empty) directory first so those builds succeed; the hook
# lives under src/ (not the repo root default) to satisfy file-placement rules.
[tool.hatch.build.hooks.custom]
path = "src/hatch_build.py"

# Streamlit v2 component manifest. asset_dir resolves against the *package root*
# — the installed streamlit_markdown_editor/ directory — and must stay inside it,
# so this names the force-included bundle above, not the repo-relative source
# path. The key Python registers with is "<[project].name>.<name>", i.e.
# "streamlit-markdown-editor.streamlit_markdown_editor" (see _component.py).
[[tool.streamlit.component.components]]
name = "streamlit_markdown_editor"
asset_dir = "frontend"

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL", "RUF", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"] # docstrings not required in tests

# Cognitive-complexity check (flake8-cognitive-complexity). Flags functions whose
# cognitive complexity exceeds the threshold — the measure ruff's mccabe (C901)
# cyclomatic check does not cover. Threshold below is a starting value; adjust.
# NOTE: flake8 does not read pyproject.toml natively — this section is honoured
# only when the Flake8-pyproject plugin is installed, and the check runs only when
# flake8 (the runner) and flake8-cognitive-complexity are both present.
[tool.flake8]
max-cognitive-complexity = 10

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

# numpy (pulled in transitively by streamlit) ships stubs written with 3.12+
# `type` statement syntax, which is a hard syntax error under our 3.10 floor and
# aborts the whole run before our own code is checked. Skip following into it;
# python_version stays at 3.10 because that is the version this package must
# actually support. Deliberately scoped to numpy — skipping streamlit would
# degrade st.components.v2 to Any, exactly where strict checking earns its keep.
[[tool.mypy.overrides]]
# "numpy" itself as well as "numpy.*": the offending stub is numpy/__init__.pyi,
# and the .* pattern covers only submodules.
module = ["numpy", "numpy.*"]
follow_imports = "skip"
# follow_imports alone is ignored for stub files, and the offending file is a
# .pyi — this makes the skip apply to stubs too.
follow_imports_for_stubs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/e2e is a Node/Playwright project (no Python tests) — keep pytest out of it.
addopts = "--cov=streamlit_markdown_editor --cov-report=term-missing --cov-fail-under=85 --ignore=tests/e2e"

[tool.bandit]
# Security scan of package code only; tests use `assert` (B101) legitimately.
exclude_dirs = ["tests", ".venv"]
