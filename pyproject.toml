[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "streamlit-markdown-editor"
version = "0.0.1"
description = "A dual-mode (WYSIWYG/raw) markdown editor component for Streamlit."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Jeff Lowrey" }]
keywords = ["streamlit", "markdown", "editor", "wysiwyg", "component"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "streamlit>=1.60",
]

[project.urls]
Homepage = "https://github.com/jaral-labs/streamlit-markdown-editor"
Repository = "https://github.com/jaral-labs/streamlit-markdown-editor"
Issues = "https://github.com/jaral-labs/streamlit-markdown-editor/issues"

# PEP 735 dev dependency group (installed via `uv sync`).
[dependency-groups]
dev = [
  "ruff",
  "mypy",
  "pytest",
  "pytest-cov",
  "pre-commit",
  "bandit[toml]",
]

# src-layout: ship the package from src/ (TECH-001).
[tool.hatch.build.targets.wheel]
packages = ["src/streamlit_markdown_editor"]

# The frontend bundle is a build artifact: generated by `npm run build`, ignored
# by git, and never committed. force-include is required because hatchling's
# default file selection honours .gitignore — without it the wheel builds and
# publishes successfully with no frontend at all. Build the frontend *before*
# `uv build`; CI does this and then asserts the assets landed (see publish.yml).
[tool.hatch.build.targets.wheel.force-include]
"frontend/build" = "streamlit_markdown_editor/frontend"

# Ship the same assets in the sdist so it can be rebuilt without Node.
[tool.hatch.build.targets.sdist.force-include]
"frontend/build" = "frontend/build"

# Streamlit v2 component asset registration: points at the packaged copy of the
# frontend bundle (inside the installed package), not the repo-relative source.
[[tool.streamlit.component.components]]
name = "streamlit_markdown_editor"
asset_dir = "src/streamlit_markdown_editor/frontend"

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL", "RUF", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"] # docstrings not required in tests

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=streamlit_markdown_editor --cov-report=term-missing --cov-fail-under=85"

[tool.bandit]
# Security scan of package code only; tests use `assert` (B101) legitimately.
exclude_dirs = ["tests", ".venv"]
