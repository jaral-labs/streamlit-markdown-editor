  name: release-please

  on:
    push:
      branches:
        - main

  permissions:
    contents: write
    pull-requests: write
    issues: write

  jobs:
    release-please:
      runs-on: ubuntu-latest
      steps:
        # Maintains a standing release PR that bumps version files + CHANGELOG from
        # Conventional Commits; merging it tags and cuts the GitHub Release. Runs
        # with an org-admin PAT (RELEASE_PLEASE_TOKEN) so it can open the release PR
        # and create the v* tag; the org protect-release-tags ruleset restricts tag
        # creation to org admins, which the default GITHUB_TOKEN is not.
        - uses: googleapis/release-please-action@v4
          with:
            config-file: release-please-config.json
            manifest-file: .release-please-manifest.json
            token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
