name: publish

# Builds the distributions once and publishes them via PyPI "trusted publishing"
# (OIDC) — no API tokens or secrets. Fires when a GitHub Release is published
# (release-please creates those), and can be run manually against TestPyPI.

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # frontend/build/ is gitignored, so a clean checkout has no bundle. It must
      # be built here or the wheel ships without a frontend — silently.
      - name: Build frontend bundle
        working-directory: frontend
        run: npm ci && npm run build
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Build sdist + wheel
        run: uv build
      # Publishing is irreversible, so verify the bundle actually landed in the
      # wheel *before* the publish jobs run. Both the missing-build and the
      # missing-force-include failure modes are otherwise silent.
      - name: Verify frontend assets are packaged
        run: |
          set -euo pipefail
          wheel=$(ls dist/*.whl)
          echo "Inspecting $wheel"
          if ! unzip -l "$wheel" | grep -qE 'streamlit_markdown_editor/frontend/index-.*\.js'; then
            echo "::error::Wheel is missing the frontend bundle (streamlit_markdown_editor/frontend/index-*.js)"
            unzip -l "$wheel"
            exit 1
          fi
          echo "OK: frontend bundle present in wheel"
          if ! unzip -l "$wheel" | grep -qE 'streamlit_markdown_editor/THIRD_PARTY_LICENSES\.txt'; then
            echo "::error::Wheel is missing THIRD_PARTY_LICENSES.txt (run 'npm run licenses' and commit it)"
            unzip -l "$wheel"
            exit 1
          fi
          echo "OK: third-party license notice present in wheel"
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    # Trusted publishing — no token. One-time setup on test.pypi.org:
    #   project "streamlit-markdown-editor" -> Publishing -> Add a pending/trusted
    #   publisher (GitHub): owner=jaral-labs, repository=streamlit-markdown-editor,
    #   workflow=publish.yml, environment=(leave blank).
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Publishes to real PyPI on published Releases only (manual workflow_dispatch
    # stays TestPyPI-only). Requires, on pypi.org:
    #   - a trusted publisher: owner=jaral-labs, repository=streamlit-markdown-editor,
    #     workflow=publish.yml, environment=pypi
    #   - a `pypi` environment (Settings -> Environments), ideally with required
    #     reviewers so each release pauses for manual approval before it ships.
    if: ${{ github.event_name == 'release' }}
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
