name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check & security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Bandit (security)
        run: uv run bandit -c pyproject.toml -r src

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --python ${{ matrix.python-version }}
      - name: Pytest (coverage gate from pyproject)
        run: uv run pytest

  frontend:
    name: Frontend gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Prettier format check
        run: npm run format:check
      - name: ESLint (incl. eslint-plugin-security)
        run: npm run lint
      - name: npm audit (dependency security)
        run: npm run security
      - name: Vitest
        run: npm test
      - name: Build
        run: npm run build
      - name: Regenerate third-party license notice
        run: npm run licenses
      - name: Verify THIRD_PARTY_LICENSES.txt is committed and current
        working-directory: ${{ github.workspace }}
        run: |
          git diff --exit-status THIRD_PARTY_LICENSES.txt \
            || { echo "::error::THIRD_PARTY_LICENSES.txt is stale — run 'npm run licenses' in frontend/ and commit the result."; exit 1; }

  integration:
    name: Packaged-component integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The integration test builds the wheel, which force-includes frontend/build/;
      # that directory is gitignored, so the frontend must be built here first (the
      # test skips when it is absent — e.g. in the unit-test matrix job).
      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend bundle
        working-directory: frontend
        run: npm ci && npm run build
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync
      - name: Integration test (build wheel, install into a clean venv, AppTest)
        run: uv run pytest tests/integration/ --no-cov

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend bundle
        working-directory: frontend
        run: npm ci && npm run build
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      # The demo must run from a *wheel* install, not an editable one, so the
      # component's in-package manifest + bundle are discoverable at runtime.
      - name: Build wheel and install into an isolated venv
        run: |
          uv build --wheel
          uv venv .venv-e2e
          uv pip install --python .venv-e2e/bin/python dist/*.whl
      - name: Install Playwright + Chromium
        working-directory: tests/e2e
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Run Playwright e2e
        working-directory: tests/e2e
        env:
          # Point the webServer at the wheel env's streamlit (see playwright.config.ts).
          STREAMLIT_BIN: ${{ github.workspace }}/.venv-e2e/bin/streamlit
        run: npx playwright test
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 7
